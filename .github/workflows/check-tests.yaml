name: Check integration tests workflow

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-$${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: nix develop --fallback --command bash -e {0}

permissions:
  contents: read

jobs:
  check-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - name: Get changed files
        id: changed-files
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            files:
              - '*.nix'
              - 'go.*'
              - '**/*.go'
              - 'flake.lock'
              - '.github/workflows/gh-action-integration-generator.go'
      - uses: NixOS/nix-installer-action@v1.0.0
        if: steps.changed-files.outputs.files == 'true'
      - uses: Mic92/hestia@v3.1.0
        if: steps.changed-files.outputs.files == 'true'

      - name: Generate and check integration tests
        if: steps.changed-files.outputs.files == 'true'
        run: |
          (cd .github/workflows && go generate)
          git diff --exit-code .github/workflows/test-integration.yaml

      - name: Show missing tests
        if: failure()
        run: |
          git diff .github/workflows/test-integration.yaml
