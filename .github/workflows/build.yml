name: Build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-$${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: nix develop --fallback --command bash -e {0}

permissions:
  contents: read

jobs:
  build-nix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The vendor hash review comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Get changed files
        id: changed-files
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            files:
              - '*.nix'
              - 'go.*'
              - '**/*.go'
              - 'flake.lock'
              - 'flakehashes.json'
      - uses: NixOS/nix-installer-action@v1.0.0
        if: steps.changed-files.outputs.files == 'true'
      - uses: Mic92/hestia@v3.1.0
        if: steps.changed-files.outputs.files == 'true'

      - name: Check vendor hash
        id: vendorhash
        if: steps.changed-files.outputs.files == 'true'
        run: |
          go run ./cmd/vendorhash check | tee check-result
          {
            grep '^expected_sri=' check-result || true
            grep '^actual_sri='   check-result || true
          } >> "$GITHUB_OUTPUT"

      - name: Vendor hash diverging
        uses: actions/github-script@v9.0.0
        if: failure() && steps.vendorhash.outcome == 'failure'
        env:
          EXPECTED_SRI: ${{ steps.vendorhash.outputs.expected_sri }}
          ACTUAL_SRI: ${{ steps.vendorhash.outputs.actual_sri }}
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            github.rest.pulls.createReviewComment({
              pull_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Vendor hash in \`flakehashes.json\` is stale (was \`${process.env.EXPECTED_SRI}\`, should be \`${process.env.ACTUAL_SRI}\`). Run \`go run ./cmd/vendorhash update\` and commit the result.`
            })

      - name: Run nix build
        if: steps.changed-files.outputs.files == 'true'
        run: nix build --fallback

      - uses: actions/upload-artifact@v7.0.2
        if: steps.changed-files.outputs.files == 'true'
        with:
          name: headscale-linux
          path: result/bin/headscale
  # The new CLI, selected by the build tag until it replaces the old one.
  build-newcli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: NixOS/nix-installer-action@v1.0.0
      - uses: Mic92/hestia@v3.1.0

      - name: Build with the newcli tag
        env:
          CGO_ENABLED: 0
        run: go build -tags newcli -o headscale ./cmd/headscale

      - name: Test with the newcli tag
        env:
          CGO_ENABLED: 0
        run: go test -tags newcli ./cmd/headscale ./cmd/headscale/newcli/... ./cmdline/... ./client/...

  # Tab in real shells against the built binary: the only test that sees
  # cobra's scripts and the completion protocol together. It records what
  # bash, zsh, fish and PowerShell do, their known faults included, so a
  # cobra bump or a change of the CLI shows as a diff.
  newcli-shells:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Get changed files
        id: changed-files
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            files:
              - 'go.mod'
              - 'go.sum'
              - 'flake.nix'
              - 'flake.lock'
              - 'cmdline/**'
              - 'cmd/headscale/*.go'
              - 'cmd/headscale/newcli/**'
              - '.github/workflows/build.yml'
      - uses: NixOS/nix-installer-action@v1.0.0
        if: steps.changed-files.outputs.files == 'true'
      - uses: Mic92/hestia@v3.1.0
        if: steps.changed-files.outputs.files == 'true'

      - name: Tab in bash, zsh, fish and PowerShell
        if: steps.changed-files.outputs.files == 'true'
        # The shells live in a dev shell of their own.
        shell: nix develop .#shells --fallback --command bash -e {0}
        run: cmd/headscale/newcli/testdata/shells/run.sh

  build-cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env:
          - "GOARCH=arm64 GOOS=linux"
          - "GOARCH=amd64 GOOS=linux"
          - "GOARCH=arm64 GOOS=darwin"
          - "GOARCH=amd64 GOOS=darwin"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: NixOS/nix-installer-action@v1.0.0
      - uses: Mic92/hestia@v3.1.0

      - name: Run go cross compile
        env:
          CGO_ENABLED: 0
        run: env ${{ matrix.env }} go build -o "headscale"
          ./cmd/headscale
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: "headscale-${{ matrix.env }}"
          path: "headscale"
