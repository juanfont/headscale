name: "Vouch - Sync CODEOWNERS"

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vouch-manage
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # The bot App's token, not GITHUB_TOKEN: the App is the ruleset bypass
      # actor that lets merge-immediately land without review or checks.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.HEADSCALE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.HEADSCALE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # vouch branches off the checkout and squash-merges into main through
          # the App's bypass, so a dispatch on any other branch would land it.
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app.outputs.token }}

      - uses: mitchellh/vouch/action/sync-codeowners@d66fa29a64600490892131ad87597c30c91fcac4 # v1.5.0
        with:
          repo: ${{ github.repository }}
          pull-request: "true"
          merge-immediately: "true"
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
