name: NixOS Module Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-$${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  nix-module-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Get changed files
        id: changed-files
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            nix:
              - 'nix/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'flakehashes.json'
            go:
              - 'go.*'
              - '**/*.go'
              - 'cmd/**'
              - 'hscontrol/**'

      - uses: NixOS/nix-installer-action@v1.0.0
        if: steps.changed-files.outputs.nix == 'true' || steps.changed-files.outputs.go == 'true'

      - uses: Mic92/hestia@v3.1.0
        if: steps.changed-files.outputs.nix == 'true' || steps.changed-files.outputs.go == 'true'

      - name: Run NixOS module tests
        if: steps.changed-files.outputs.nix == 'true' || steps.changed-files.outputs.go == 'true'
        run: |
          echo "Running NixOS module integration test..."
          nix build .#checks.x86_64-linux.headscale .#checks.x86_64-linux.headscale-checks -L --fallback
