name: Nix Flake Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-$${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Each job only runs `nix build .#checks.<system>.<name>`; the check logic lives
# in flake.nix via the flake-checks library. The fileset-filtered checks hit the
# hestia cache when their inputs are unchanged, so no changed-files gating.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: NixOS/nix-installer-action@v1.0.0
      - uses: Mic92/hestia@v3.1.0
      - name: build
        run: nix build -L .#checks.x86_64-linux.build

  gotest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: NixOS/nix-installer-action@v1.0.0
      - uses: Mic92/hestia@v3.1.0
      - name: gotest
        run: nix build -L .#checks.x86_64-linux.gotest

  gorace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: NixOS/nix-installer-action@v1.0.0
      - uses: Mic92/hestia@v3.1.0
      - name: gorace
        run: nix build -L .#checks.x86_64-linux.gorace

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: NixOS/nix-installer-action@v1.0.0
      - uses: Mic92/hestia@v3.1.0
      - name: golangci-lint
        run: nix build -L .#checks.x86_64-linux.golangci-lint

  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: NixOS/nix-installer-action@v1.0.0
      - uses: Mic92/hestia@v3.1.0
      - name: formatting
        run: nix build -L .#checks.x86_64-linux.formatting

  nixos-options:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: NixOS/nix-installer-action@v1.0.0
      - uses: Mic92/hestia@v3.1.0
      - name: nixos-options
        run: nix build -L .#checks.x86_64-linux.nixos-options

  nixos-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: NixOS/nix-installer-action@v1.0.0
      - uses: Mic92/hestia@v3.1.0
      - name: nixos-module
        run: nix build -L .#checks.x86_64-linux.nixos-module
