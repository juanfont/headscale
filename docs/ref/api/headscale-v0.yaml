          description: "Unauthorized: unauthorized"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unprocessable Entity: invalid_field"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Internal Server Error: internal"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Service Unavailable: unhealthy"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
      security:
        - bearer: []
      summary: Who makes this request, how it is authenticated, and what it may do
      tags:
        - Server
      x-problem-codes:
        - internal
        - invalid_field
        - unauthorized
        - unhealthy
  /api/headscale/v0/users:
    get:
      operationId: listUsers
      parameters:
        - description: Rows on one page.
          explode: false
          in: query
          name: pageSize
          schema:
            default: 25
            description: Rows on one page.
            format: int64
            maximum: 1000
            minimum: 1
            type: integer
        - description: nextPageToken of the page before, unchanged, with the same filters. Leave it out for the first page.
          explode: false
          in: query
          name: pageToken
          schema:
            description: nextPageToken of the page before, unchanged, with the same filters. Leave it out for the first page.
            type: string
        - description: Only users with exactly this name. More than one user can have a name.
          explode: false
          in: query
          name: name
          schema:
            description: Only users with exactly this name. More than one user can have a name.
            type: string
        - description: Only users with exactly this email.
          explode: false
          in: query
          name: email
          schema:
            description: Only users with exactly this email.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
          description: OK
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unauthorized: unauthorized"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Forbidden: forbidden"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unprocessable Entity: invalid_field, invalid_page_token"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Internal Server Error: internal"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
