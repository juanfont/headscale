            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Service Unavailable: unhealthy"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
      security:
        - bearer:
            - users:read
      summary: List users
      tags:
        - Users
      x-problem-codes:
        - forbidden
        - internal
        - invalid_field
        - invalid_page_token
        - unauthorized
        - unhealthy
    post:
      description: "The name and the email must not equal the name, the email or the provider identifier of another user, without regard to case: a policy names a user by these texts."
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: Created
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
            Location:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Bad Request: invalid_request"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
