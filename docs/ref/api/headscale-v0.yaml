            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
      security:
        - bearer:
            - all
      summary: Create an API key
      tags:
        - API keys
