                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unauthorized: unauthorized"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Forbidden: forbidden"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not Found: not_found"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unprocessable Entity: invalid_field"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Internal Server Error: internal"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "503":
          content:
            application/problem+json:
              schema:
