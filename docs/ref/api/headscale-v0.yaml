info:
  description: Headscale's own API. It may change in any minor release; every change is in the changelog under "API v0".
  title: Headscale API
  version: v0
openapi: 3.1.0
paths:
  /api/headscale/v0/api-keys:
    get:
      description: In ID order, expired and revoked keys too, until the server removes them. No answer holds a secret.
      operationId: listAPIKeys
      parameters:
        - description: Rows on one page.
          explode: false
          in: query
          name: pageSize
          schema:
            default: 25
            description: Rows on one page.
            format: int64
            maximum: 1000
            minimum: 1
            type: integer
        - description: nextPageToken of the page before, unchanged, with the same filters. Leave it out for the first page.
          explode: false
          in: query
          name: pageToken
          schema:
            description: nextPageToken of the page before, unchanged, with the same filters. Leave it out for the first page.
            type: string
        - description: Only the keys owned by the user with this ID; an ID no user has matches no key.
          explode: false
          in: query
          name: user
          schema:
            description: Only the keys owned by the user with this ID; an ID no user has matches no key.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyList"
          description: OK
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unauthorized: unauthorized"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Forbidden: forbidden"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unprocessable Entity: invalid_field, invalid_page_token"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Internal Server Error: internal"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Service Unavailable: unhealthy"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
      security:
        - bearer:
            - all:read
      summary: List API keys
      tags:
        - API keys
      x-problem-codes:
        - forbidden
        - internal
        - invalid_field
        - invalid_page_token
        - unauthorized
        - unhealthy
    post:
      description: An API key may do everything, so only an API key or the unix socket can make one; an OAuth access token cannot, whatever its scopes. The answer holds the secret, in key; no other answer does.
