components:
  schemas:
    AuthKey:
      additionalProperties: false
      properties:
        created:
          description: null for a key that does not record it.
          format: date-time
          type:
            - string
            - "null"
        createdBy:
          $ref: "#/components/schemas/UserReference"
          description: The user who owns the credential that made the key; null for a key older than this field, made over the socket, or whose user is deleted. Not the owner.
        description:
          description: Free text for people, such as what the key is for; "" for none.
          type: string
        ephemeral:
          description: A node that joins with the key is removed some time after it disconnects.
          type: boolean
        expiry:
          description: When the key stops working; null for a key that never expires.
          format: date-time
          type:
            - string
            - "null"
        id:
          type: string
        owner:
          $ref: "#/components/schemas/Owner"
          description: The user, or the tags, that a node joining with the key gets; for a tagged key user is null.
        prefix:
          description: The part of the key that is not secret.
          type: string
        removal:
          description: "When the server removes the revoked record; null while it is kept: not revoked, kept for ever, or a node still refers to the key."
          format: date-time
          type:
            - string
            - "null"
        reusable:
          type: boolean
        revoked:
          description: When the key was revoked, or null.
          format: date-time
          type:
            - string
            - "null"
        state:
          $ref: "#/components/schemas/AuthKeyState"
        used:
          description: A node has joined with the key.
          type: boolean
      required:
        - id
        - prefix
        - description
        - owner
        - createdBy
        - state
        - used
        - reusable
        - ephemeral
        - expiry
        - created
        - revoked
        - removal
      type: object
    AuthKeyList:
      additionalProperties: false
      properties:
        authKeys:
          items:
            $ref: "#/components/schemas/AuthKey"
          type: array
        nextPageToken:
          description: Present when more rows can follow; send it back as pageToken. Missing on the last page.
          type: string
      required:
        - authKeys
      type: object
    AuthKeyState:
      description: revoked wins over used, which wins over expired; used is a single-use key that a node took. A client must accept a value it does not know.
      enum:
        - valid
        - used
        - expired
        - revoked
      type: string
    Authorization:
      additionalProperties: false
      properties:
        resources:
          description: The resources the scopes apply to. own is reserved; a client that does not know a value must act as limited.
          enum:
            - all
            - own
          type: string
        scopes:
          description: The scopes the request has. An API key and the unix socket have all.
          items:
            type: string
          type: array
        tags:
          description: "The tags the caller may give, with those they own in the policy. null: tags do not limit the caller."
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - scopes
        - tags
        - resources
      type: object
    ClientReference:
      additionalProperties: false
      properties:
        description:
          type: string
        id:
          type: string
      required:
        - id
        - description
      type:
        - object
        - "null"
    CreateAuthKeyBody:
      additionalProperties: false
      properties:
        description:
          description: Free text for people, such as what the key is for.
          maxLength: 50
          type: string
        ephemeral:
          description: A node that joins with the key is removed some time after it disconnects.
          type: boolean
        expiry:
          description: When the key stops working, in the future. Required; there is no upper limit.
          format: date-time
          type: string
        reusable:
          description: More than one node may join with the key.
          type: boolean
        tags:
          description: The tags of the nodes that join with the key, each in tagOwners of the policy. Exactly one of userId and tags.
          items:
            type: string
          maxItems: 256
          type: array
        userId:
          description: The user who owns the nodes that join with the key. Exactly one of userId and tags.
          maxLength: 20
          type: string
      type: object
    CreateUserBody:
      additionalProperties: false
      properties:
        displayName:
          maxLength: 128
          type: string
        email:
          maxLength: 254
          type: string
        name:
          description: The username.
          maxLength: 254
          type: string
        profilePicUrl:
          description: An absolute http or https URL.
          maxLength: 2048
          type: string
      required:
        - name
      type: object
    CreatedAuthKey:
      additionalProperties: false
      properties:
        created:
          description: null for a key that does not record it.
          format: date-time
          type:
            - string
            - "null"
        createdBy:
          $ref: "#/components/schemas/UserReference"
          description: The user who owns the credential that made the key; null for a key older than this field, made over the socket, or whose user is deleted. Not the owner.
        description:
          description: Free text for people, such as what the key is for; "" for none.
          type: string
        ephemeral:
          description: A node that joins with the key is removed some time after it disconnects.
          type: boolean
        expiry:
          description: When the key stops working; null for a key that never expires.
          format: date-time
          type:
            - string
            - "null"
        id:
          type: string
        key:
          description: The secret. It is in this answer and no other; the server keeps only a hash of it.
          type: string
        owner:
          $ref: "#/components/schemas/Owner"
          description: The user, or the tags, that a node joining with the key gets; for a tagged key user is null.
        prefix:
          description: The part of the key that is not secret.
          type: string
        removal:
          description: "When the server removes the revoked record; null while it is kept: not revoked, kept for ever, or a node still refers to the key."
          format: date-time
          type:
            - string
            - "null"
        reusable:
          type: boolean
        revoked:
          description: When the key was revoked, or null.
          format: date-time
          type:
            - string
            - "null"
        state:
          $ref: "#/components/schemas/AuthKeyState"
        used:
          description: A node has joined with the key.
          type: boolean
      required:
        - key
        - id
        - prefix
        - description
        - owner
        - createdBy
        - state
        - used
        - reusable
        - ephemeral
        - expiry
        - created
        - revoked
        - removal
      type: object
    Credential:
      additionalProperties: false
      properties:
        client:
          $ref: "#/components/schemas/ClientReference"
          description: For a token, the OAuth client it was issued to.
        expiry:
          format: date-time
          type:
            - string
            - "null"
        id:
          description: The ID of the stored credential; for an API key, the ID in /api-keys/{id}.
          type: string
        kind:
          enum:
            - apiKey
            - oauthToken
          type: string
        owner:
          $ref: "#/components/schemas/Owner"
          description: For an API key, the user recorded on it. It does not say who makes the request.
        prefix:
          description: The part of the secret that is not secret.
          type: string
      required:
        - kind
        - id
        - prefix
        - expiry
        - owner
        - client
      type:
        - object
        - "null"
    FieldError:
      additionalProperties: false
      properties:
        location:
          description: Where the field is, such as body.tags[2] or query.pageSize.
          type: string
        message:
          type: string
      required:
        - location
        - message
      type: object
    GoInfo:
      additionalProperties: false
      properties:
        arch:
          type: string
        os:
          type: string
        version:
          type: string
      required:
        - version
        - os
        - arch
      type: object
    Health:
      additionalProperties: false
      properties:
        databaseConnectivity:
          type: boolean
        healthy:
          type: boolean
        warnings:
          description: What an admin should know; a warning never makes the server unhealthy. New codes may appear.
          items:
            $ref: "#/components/schemas/Message"
          type: array
      required:
        - healthy
        - databaseConnectivity
        - warnings
      type: object
    Identity:
      additionalProperties: false
      properties:
        issuer:
          type: string
        subject:
          type: string
      required:
        - issuer
        - subject
      type:
        - object
        - "null"
    Me:
      additionalProperties: false
      properties:
        authorization:
          $ref: "#/components/schemas/Authorization"
        credential:
          $ref: "#/components/schemas/Credential"
        principal:
          $ref: "#/components/schemas/Principal"
      required:
        - principal
        - credential
        - authorization
      type: object
    Message:
      additionalProperties: false
      properties:
        code:
          enum:
            - credential_check_busy
            - database_unreachable
            - node_expiry_invalid
            - node_name_invalid
          type: string
        details:
          additionalProperties: {}
          description: Data for this code; {} when it has none.
          type: object
        message:
          type: string
      required:
        - code
        - message
        - details
      type: object
    Node:
      additionalProperties: false
      properties:
        addresses:
          description: IPv4 first.
          items:
            type: string
          type: array
        advertisedRoutes:
          description: Routes the node offers.
          items:
            type: string
          type: array
        attributes:
          additionalProperties:
            type: string
          description: Node attributes, by name.
          type: object
        authKeyId:
          description: The ID of the auth key the node joined with.
          type:
            - string
            - "null"
        clientVersion:
          description: The short version of the Tailscale client; "" when unknown.
          type: string
        connectedToControl:
          description: The node holds a session with the server, expired or not. A node that is not expired stays connected for 15 seconds after its session ends; an expired node is released at once.
          type: boolean
        created:
          format: date-time
          type: string
        createdBy:
          $ref: "#/components/schemas/UserReference"
          description: The user who registered the node; null when the server does not know. Not the owner of a tagged node.
        discoKey:
          type: string
        enabledRoutes:
          description: Routes an admin or the policy approved.
          items:
            type: string
          type: array
        expired:
          description: The expiry has passed, by the server's clock.
          type: boolean
        expiry:
          description: "null: the node never expires, or its stored expiry is out of range (problems names it)."
          format: date-time
          type:
            - string
            - "null"
        fqdn:
          description: name and the base domain, without a trailing dot; "" when no base domain is set.
          type: string
        hostname:
          description: What the node reports. Read-only.
          type: string
        id:
          type: string
        isEphemeral:
          description: The node is removed some time after it disconnects.
          type: boolean
        lastSeen:
          description: Now while the node is connected; null if it never connected.
          format: date-time
          type:
            - string
            - "null"
        machineKey:
          type: string
        name:
          description: The name in Headscale, which can be changed.
          type: string
        nodeKey:
          type: string
        os:
          description: As the node reports it; "" when unknown.
          type: string
        owner:
          $ref: "#/components/schemas/Owner"
          description: One user, or tags.
        problems:
          description: The codes of the health checks the node fails, as in the warnings of GET /health; [] for a good node.
          items:
            type: string
          type: array
        registerMethod:
          description: How the node registered; "" for a node that does not record it, as os and clientVersion are "" when unknown. A client must accept a value it does not know.
          enum:
            - authKey
            - cli
            - oidc
            - ""
          type: string
        revision:
          description: Changes when the owner, the tags, the enabled routes, the name or the expiry change. Send it back in If-Match.
          type: string
        servingRoutes:
          description: "Routes the node serves to others now: approved, offered, and with this node chosen to serve them; exit routes too."
          items:
            type: string
          type: array
        updateAvailable:
          description: A newer stable Tailscale client exists; false also when the server does not know.
          type: boolean
      required:
        - id
        - name
        - hostname
        - fqdn
        - owner
        - addresses
        - connectedToControl
        - lastSeen
        - expiry
        - expired
        - created
        - clientVersion
        - updateAvailable
        - os
        - enabledRoutes
        - advertisedRoutes
        - servingRoutes
        - isEphemeral
        - registerMethod
        - authKeyId
        - createdBy
        - machineKey
        - nodeKey
        - discoKey
        - attributes
        - revision
        - problems
      type: object
    NodeList:
      additionalProperties: false
      properties:
        nextPageToken:
          description: Present when more rows can follow; send it back as pageToken. Missing on the last page.
          type: string
        nodes:
          items:
            $ref: "#/components/schemas/Node"
          type: array
      required:
        - nodes
      type: object
    NodeReference:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    Owner:
      additionalProperties: false
      properties:
        tags:
          items:
            type: string
          type: array
        user:
          $ref: "#/components/schemas/OwnerUser"
      required:
        - user
        - tags
      type:
        - object
        - "null"
    OwnerUser:
      additionalProperties: false
      properties:
        displayName:
          type: string
        email:
          type: string
        id:
          type: string
        loginName:
          type: string
        name:
          type: string
      required:
        - id
        - name
        - loginName
        - displayName
        - email
      type:
        - object
        - "null"
    Principal:
      additionalProperties: false
      properties:
        identity:
          $ref: "#/components/schemas/Identity"
          description: "The identity at an outside identity provider. Reserved: null today."
        kind:
          description: Who or what is authenticated. human and workload are reserved.
          enum:
            - apiKey
            - oauthClient
            - local
            - human
            - workload
          type: string
        user:
          $ref: "#/components/schemas/UserReference"
          description: "The Headscale user that has identity. Reserved: null today."
      required:
        - kind
        - identity
        - user
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: The stable code of the problem. Clients branch on this.
          enum:
            - email_taken
            - empty_patch
            - expiry_in_past
            - expiry_required
            - forbidden
            - internal
            - invalid_field
            - invalid_page_token
            - invalid_request
            - method_not_allowed
            - name_taken
            - not_acceptable
            - not_found
            - owner_conflict
            - precondition_failed
            - request_timeout
            - tags_not_permitted
            - tags_required
            - too_large
            - unauthorized
            - unhealthy
            - unsupported_media_type
            - update_refused
            - user_managed_by_oidc
          type: string
        detail:
          description: A sentence for a person. It may change; programs must not read it.
          type: string
        details:
          additionalProperties: {}
          description: Data for this code, as its documentation describes.
          type: object
        errors:
          description: "For invalid_field: one entry per field."
          items:
            $ref: "#/components/schemas/FieldError"
          type: array
        object:
          $ref: "#/components/schemas/ProblemObject"
          description: The resource the problem is about, or null.
        requestId:
          description: The ID of this request in the server log.
          type: string
        status:
          description: The HTTP status.
          format: int64
          type: integer
        title:
          description: A short text, the same for every problem with this code.
          type: string
        type:
          description: A URL naming the problem, one per code; it leads to its documentation.
          type: string
      required:
        - type
        - title
        - status
        - code
        - detail
        - requestId
        - object
        - errors
        - details
      type: object
    ProblemObject:
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          enum:
            - node
            - user
            - authKey
            - apiKey
            - oauthClient
            - authRequest
          type: string
        name:
          type: string
      required:
        - kind
        - id
        - name
      type:
        - object
        - "null"
    SetNodeRoutesBody:
      additionalProperties: false
      properties:
        routes:
          description: IP prefixes; [] removes them all. One exit prefix approves both.
          items:
            type: string
          maxItems: 4096
          type: array
      required:
        - routes
      type: object
    SetNodeTagsBody:
      additionalProperties: false
      properties:
        tags:
          description: At least one tag, each in tagOwners of the policy.
          items:
            type: string
          maxItems: 256
          type: array
      required:
        - tags
      type: object
    Tag:
      additionalProperties: false
      properties:
        inPolicy:
          description: The tag is in tagOwners of the policy; false for a tag nodes still have that the policy no longer names.
          type: boolean
        nodeCount:
          description: Every node that has the tag, also with the node filter.
          format: int64
          type: integer
        nodes:
          description: The same nodes, in ID order.
          items:
            $ref: "#/components/schemas/NodeReference"
          type: array
        tag:
          type: string
      required:
        - tag
        - inPolicy
        - nodeCount
        - nodes
      type: object
    TagList:
      additionalProperties: false
      properties:
        nextPageToken:
          description: Present when more rows can follow; send it back as pageToken. Missing on the last page.
          type: string
        tags:
          items:
            $ref: "#/components/schemas/Tag"
          type: array
      required:
        - tags
      type: object
    UpdateNodeBody:
      additionalProperties: false
      properties:
        expiry:
          description: An RFC 3339 time in the future, "now" for the server's clock, or null for never. A time turns key expiry on.
          maxLength: 64
          type:
            - string
            - "null"
        name:
          description: A DNS label; "" resets it to the name made from the hostname.
          maxLength: 63
          type: string
      type: object
    UpdateUserBody:
      additionalProperties: false
      properties:
        displayName:
          description: "\"\" clears it."
          maxLength: 128
          type: string
        email:
          description: "\"\" clears it."
          maxLength: 254
          type: string
        name:
          description: The username; it cannot be empty.
          maxLength: 254
          type: string
        profilePicUrl:
          description: An absolute http or https URL; "" clears it.
          maxLength: 2048
          type: string
      type: object
    User:
      additionalProperties: false
      properties:
        created:
          format: date-time
          type: string
        displayName:
          type: string
        email:
          type: string
        id:
          type: string
        loginName:
          description: "What Headscale shows for the user: the email, else the name, else the provider ID. Read-only."
          type: string
        name:
          description: The stored username; it can be empty for a user from OIDC.
          type: string
        nodeCount:
          description: Nodes the user owns; tagged nodes are owned by their tags and not counted.
          format: int64
          type: integer
        nodes:
          description: The same nodes, in ID order.
          items:
            $ref: "#/components/schemas/NodeReference"
          type: array
        profilePicUrl:
          type: string
        provider:
          description: Where the user comes from. A client must accept a value it does not know.
          enum:
            - local
            - oidc
          type: string
        providerId:
          description: The identifier at the identity provider; empty for a local user.
          type: string
      required:
        - id
        - name
        - loginName
        - displayName
        - email
        - profilePicUrl
        - provider
        - providerId
        - nodeCount
        - nodes
        - created
      type: object
    UserList:
      additionalProperties: false
      properties:
        nextPageToken:
          description: Present when more rows can follow; send it back as pageToken. Missing on the last page.
          type: string
        users:
          items:
            $ref: "#/components/schemas/User"
          type: array
      required:
        - users
      type: object
    UserReference:
      additionalProperties: false
      properties:
        id:
          type: string
        loginName:
          type: string
      required:
        - id
        - loginName
      type:
        - object
        - "null"
    VersionInfo:
      additionalProperties: false
      properties:
        buildTime:
          type: string
        commit:
          type: string
        dirty:
          type: boolean
        go:
          $ref: "#/components/schemas/GoInfo"
        version:
          type: string
      required:
        - version
        - commit
        - buildTime
        - go
        - dirty
      type: object
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
info:
  description: Headscale's own API. It may change in any minor release; every change is in the changelog under "API v0".
  title: Headscale API
  version: v0
openapi: 3.1.0
paths:
  /api/headscale/v0/auth-keys:
    get:
      description: In ID order, revoked keys too, until the server removes them. No answer holds a secret.
      operationId: listAuthKeys
      parameters:
        - description: Rows on one page.
          explode: false
          in: query
          name: pageSize
          schema:
            default: 25
            description: Rows on one page.
            format: int64
            maximum: 1000
            minimum: 1
            type: integer
        - description: nextPageToken of the page before, unchanged, with the same filters. Leave it out for the first page.
          explode: false
          in: query
          name: pageToken
          schema:
            description: nextPageToken of the page before, unchanged, with the same filters. Leave it out for the first page.
            type: string
        - description: Only the keys owned by the user with this ID; tagged keys never match, and an ID no user has matches no key. With tag, a key must match both.
          explode: false
          in: query
          name: user
          schema:
            description: Only the keys owned by the user with this ID; tagged keys never match, and an ID no user has matches no key. With tag, a key must match both.
            type: string
        - description: Only the keys with this tag. With user, a key must match both.
          explode: false
          in: query
          name: tag
          schema:
            description: Only the keys with this tag. With user, a key must match both.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthKeyList"
          description: OK
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unauthorized: unauthorized"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Forbidden: forbidden"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unprocessable Entity: invalid_field, invalid_page_token"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Internal Server Error: internal"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Service Unavailable: unhealthy"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
      security:
        - bearer:
            - auth_keys:read
      summary: List auth keys
      tags:
        - Auth keys
      x-problem-codes:
        - forbidden
        - internal
        - invalid_field
        - invalid_page_token
        - unauthorized
        - unhealthy
    post:
