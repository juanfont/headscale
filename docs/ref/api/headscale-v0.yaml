components:
  schemas:
    Authorization:
      additionalProperties: false
      properties:
        resources:
          description: The resources the scopes apply to. own is reserved; a client that does not know a value must act as limited.
          enum:
            - all
            - own
          type: string
        scopes:
          description: The scopes the request has. An API key and the unix socket have all.
          items:
            type: string
          type: array
        tags:
          description: "The tags the caller may give, with those they own in the policy. null: tags do not limit the caller."
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - scopes
        - tags
        - resources
      type: object
    ClientReference:
      additionalProperties: false
      properties:
        description:
          type: string
        id:
          type: string
      required:
        - id
        - description
      type:
        - object
        - "null"
    CreateUserBody:
      additionalProperties: false
      properties:
        displayName:
          maxLength: 128
          type: string
        email:
          maxLength: 254
          type: string
        name:
          description: The username.
          maxLength: 254
          type: string
        profilePicUrl:
          description: An absolute http or https URL.
          maxLength: 2048
          type: string
      required:
        - name
      type: object
    Credential:
      additionalProperties: false
      properties:
        client:
          $ref: "#/components/schemas/ClientReference"
          description: For a token, the OAuth client it was issued to.
        expiry:
          format: date-time
          type:
            - string
            - "null"
        id:
          description: The ID of the stored credential; for an API key, the ID in /api-keys/{id}.
          type: string
        kind:
          enum:
            - apiKey
            - oauthToken
          type: string
        owner:
          $ref: "#/components/schemas/Owner"
          description: For an API key, the user recorded on it. It does not say who makes the request.
        prefix:
          description: The part of the secret that is not secret.
          type: string
      required:
        - kind
        - id
        - prefix
        - expiry
        - owner
        - client
      type:
        - object
        - "null"
    FieldError:
      additionalProperties: false
      properties:
        location:
          description: Where the field is, such as body.tags[2] or query.pageSize.
          type: string
        message:
          type: string
      required:
        - location
        - message
      type: object
    GoInfo:
      additionalProperties: false
      properties:
        arch:
          type: string
        os:
          type: string
        version:
          type: string
      required:
        - version
        - os
        - arch
      type: object
    Health:
      additionalProperties: false
      properties:
        databaseConnectivity:
          type: boolean
        healthy:
          type: boolean
        warnings:
          description: What an admin should know; a warning never makes the server unhealthy. New codes may appear.
          items:
            $ref: "#/components/schemas/Message"
          type: array
      required:
        - healthy
        - databaseConnectivity
        - warnings
      type: object
    Identity:
      additionalProperties: false
      properties:
        issuer:
          type: string
        subject:
          type: string
      required:
        - issuer
        - subject
      type:
        - object
        - "null"
    Me:
      additionalProperties: false
      properties:
        authorization:
          $ref: "#/components/schemas/Authorization"
        credential:
          $ref: "#/components/schemas/Credential"
        principal:
          $ref: "#/components/schemas/Principal"
      required:
        - principal
        - credential
        - authorization
      type: object
    Message:
      additionalProperties: false
      properties:
        code:
          enum:
            - credential_check_busy
            - database_unreachable
            - node_expiry_invalid
            - node_name_invalid
          type: string
        details:
          additionalProperties: {}
          description: Data for this code; {} when it has none.
          type: object
        message:
          type: string
      required:
        - code
        - message
        - details
      type: object
    NodeReference:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    Owner:
      additionalProperties: false
      properties:
        tags:
          items:
            type: string
          type: array
        user:
          $ref: "#/components/schemas/OwnerUser"
      required:
        - user
        - tags
      type:
        - object
        - "null"
    OwnerUser:
      additionalProperties: false
      properties:
        displayName:
          type: string
        email:
          type: string
        id:
          type: string
        loginName:
          type: string
        name:
          type: string
      required:
        - id
        - name
        - loginName
        - displayName
        - email
      type:
        - object
        - "null"
    Principal:
      additionalProperties: false
      properties:
        identity:
          $ref: "#/components/schemas/Identity"
          description: "The identity at an outside identity provider. Reserved: null today."
        kind:
          description: Who or what is authenticated. human and workload are reserved.
          enum:
            - apiKey
            - oauthClient
            - local
            - human
            - workload
          type: string
        user:
          $ref: "#/components/schemas/UserReference"
          description: "The Headscale user that has identity. Reserved: null today."
      required:
        - kind
        - identity
        - user
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: The stable code of the problem. Clients branch on this.
          enum:
            - email_taken
            - empty_patch
            - forbidden
            - internal
            - invalid_field
            - invalid_page_token
            - invalid_request
            - method_not_allowed
            - name_taken
            - not_acceptable
            - not_found
            - request_timeout
            - too_large
            - unauthorized
            - unhealthy
            - unsupported_media_type
            - user_managed_by_oidc
          type: string
        detail:
          description: A sentence for a person. It may change; programs must not read it.
          type: string
        details:
          additionalProperties: {}
          description: Data for this code, as its documentation describes.
          type: object
        errors:
          description: "For invalid_field: one entry per field."
          items:
            $ref: "#/components/schemas/FieldError"
          type: array
        object:
          $ref: "#/components/schemas/ProblemObject"
          description: The resource the problem is about, or null.
        requestId:
          description: The ID of this request in the server log.
          type: string
        status:
          description: The HTTP status.
          format: int64
          type: integer
        title:
          description: A short text, the same for every problem with this code.
          type: string
        type:
          description: A URL naming the problem, one per code; it leads to its documentation.
          type: string
      required:
        - type
        - title
        - status
        - code
        - detail
        - requestId
        - object
        - errors
        - details
      type: object
    ProblemObject:
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          enum:
            - node
            - user
            - authKey
            - apiKey
            - oauthClient
            - authRequest
          type: string
        name:
          type: string
      required:
        - kind
        - id
        - name
      type:
        - object
        - "null"
    UpdateUserBody:
      additionalProperties: false
      properties:
        displayName:
          description: "\"\" clears it."
          maxLength: 128
          type: string
        email:
          description: "\"\" clears it."
          maxLength: 254
          type: string
        name:
          description: The username; it cannot be empty.
          maxLength: 254
          type: string
        profilePicUrl:
          description: An absolute http or https URL; "" clears it.
          maxLength: 2048
          type: string
      type: object
    User:
      additionalProperties: false
      properties:
        created:
          format: date-time
          type: string
        displayName:
          type: string
        email:
          type: string
        id:
          type: string
        loginName:
          description: "What Headscale shows for the user: the email, else the name, else the provider ID. Read-only."
          type: string
        name:
          description: The stored username; it can be empty for a user from OIDC.
          type: string
        nodeCount:
          description: Nodes the user owns; tagged nodes are owned by their tags and not counted.
          format: int64
          type: integer
        nodes:
          description: The same nodes, in ID order.
          items:
            $ref: "#/components/schemas/NodeReference"
          type: array
        profilePicUrl:
          type: string
        provider:
          description: Where the user comes from. A client must accept a value it does not know.
          enum:
            - local
            - oidc
          type: string
        providerId:
          description: The identifier at the identity provider; empty for a local user.
          type: string
      required:
        - id
        - name
        - loginName
        - displayName
        - email
        - profilePicUrl
        - provider
        - providerId
        - nodeCount
        - nodes
        - created
      type: object
    UserList:
      additionalProperties: false
      properties:
        nextPageToken:
          description: Present when more rows can follow; send it back as pageToken. Missing on the last page.
          type: string
        users:
          items:
            $ref: "#/components/schemas/User"
          type: array
      required:
        - users
      type: object
    UserReference:
      additionalProperties: false
      properties:
        id:
          type: string
        loginName:
          type: string
      required:
        - id
        - loginName
      type:
        - object
        - "null"
    VersionInfo:
      additionalProperties: false
      properties:
        buildTime:
          type: string
        commit:
          type: string
        dirty:
          type: boolean
        go:
          $ref: "#/components/schemas/GoInfo"
        version:
          type: string
      required:
        - version
        - commit
        - buildTime
        - go
        - dirty
      type: object
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
info:
  description: Headscale's own API. It may change in any minor release; every change is in the changelog under "API v0".
  title: Headscale API
  version: v0
openapi: 3.1.0
paths:
  /api/headscale/v0/health:
    get:
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
          description: OK
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unauthorized: unauthorized"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unprocessable Entity: invalid_field"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Internal Server Error: internal"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Service Unavailable: unhealthy"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
      security:
        - bearer: []
      summary: The health of the server
      tags:
        - Server
      x-problem-codes:
        - internal
        - invalid_field
        - unauthorized
        - unhealthy
  /api/headscale/v0/me:
    get:
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
