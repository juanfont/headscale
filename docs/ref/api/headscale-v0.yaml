components:
  schemas:
    ApiKey:
      additionalProperties: false
      properties:
        created:
          description: null for a key that does not record it.
          format: date-time
          type:
            - string
            - "null"
        expiry:
          description: When the key stops working; null for a key that never expires.
          format: date-time
          type:
            - string
            - "null"
        id:
          type: string
        lastSeen:
          description: "When the key was last used, to the minute: a use within a minute of the last is not written. null for a key never used since it was recorded."
          format: date-time
          type:
            - string
            - "null"
        owner:
          $ref: "#/components/schemas/Owner"
          description: The user recorded on the key; tags is always []. null for a key with no owner. The owner does not limit what the key may do.
        prefix:
          description: The part of the key that is not secret.
          type: string
        removal:
          description: "When the server removes the revoked record; null while it is kept: not revoked, or kept for ever."
          format: date-time
          type:
            - string
            - "null"
        revoked:
          description: When the key was revoked, or null.
          format: date-time
          type:
            - string
            - "null"
        state:
          $ref: "#/components/schemas/ApiKeyState"
      required:
        - id
        - prefix
        - owner
        - state
        - expiry
        - created
        - lastSeen
        - revoked
        - removal
      type: object
    ApiKeyList:
      additionalProperties: false
      properties:
        apiKeys:
          items:
            $ref: "#/components/schemas/ApiKey"
          type: array
        nextPageToken:
          description: Present when more rows can follow; send it back as pageToken. Missing on the last page.
          type: string
      required:
        - apiKeys
      type: object
    ApiKeyState:
      description: revoked wins over expired. A client must accept a value it does not know.
      enum:
        - valid
        - expired
        - revoked
      type: string
    AuthKey:
      additionalProperties: false
      properties:
        created:
          description: null for a key that does not record it.
          format: date-time
          type:
            - string
            - "null"
        createdBy:
          $ref: "#/components/schemas/UserReference"
          description: The user who owns the credential that made the key; null for a key older than this field, made over the socket, or whose user is deleted. Not the owner.
        description:
          description: Free text for people, such as what the key is for; "" for none.
          type: string
        ephemeral:
          description: A node that joins with the key is removed some time after it disconnects.
          type: boolean
        expiry:
          description: When the key stops working; null for a key that never expires.
          format: date-time
          type:
            - string
            - "null"
        id:
          type: string
        owner:
          $ref: "#/components/schemas/Owner"
          description: The user, or the tags, that a node joining with the key gets; for a tagged key user is null.
        prefix:
          description: The part of the key that is not secret.
          type: string
        removal:
          description: "When the server removes the revoked record; null while it is kept: not revoked, kept for ever, or a node still refers to the key."
          format: date-time
          type:
            - string
            - "null"
        reusable:
          type: boolean
        revoked:
          description: When the key was revoked, or null.
          format: date-time
          type:
            - string
            - "null"
        state:
          $ref: "#/components/schemas/AuthKeyState"
        used:
          description: A node has joined with the key.
          type: boolean
      required:
        - id
        - prefix
        - description
        - owner
        - createdBy
        - state
        - used
        - reusable
        - ephemeral
        - expiry
        - created
        - revoked
        - removal
      type: object
    AuthKeyList:
      additionalProperties: false
      properties:
        authKeys:
          items:
            $ref: "#/components/schemas/AuthKey"
          type: array
        nextPageToken:
          description: Present when more rows can follow; send it back as pageToken. Missing on the last page.
          type: string
      required:
        - authKeys
      type: object
    AuthKeyState:
      description: revoked wins over used, which wins over expired; used is a single-use key that a node took. A client must accept a value it does not know.
      enum:
        - valid
        - used
        - expired
        - revoked
      type: string
    AuthRequest:
      additionalProperties: false
      properties:
        destination:
          $ref: "#/components/schemas/SSHCheckNodeReference"
          description: The node an SSH check is to; null for a registration.
        hostname:
          description: The hostname a registering node reports; "" for an SSH check.
          type: string
        id:
          description: The auth ID that the machine shows, a secret; it starts with hskey-authreq-.
          type: string
        kind:
          description: registration is answered with register or reject, sshCheck with approve or reject. A client must accept a kind it does not know.
          enum:
            - registration
            - sshCheck
          type: string
        source:
          $ref: "#/components/schemas/SSHCheckNodeReference"
          description: The node an SSH check is from; null for a registration.
      required:
        - id
        - kind
        - hostname
        - source
        - destination
      type: object
    Authorization:
      additionalProperties: false
      properties:
        resources:
          description: The resources the scopes apply to. own is reserved; a client that does not know a value must act as limited.
          enum:
            - all
            - own
          type: string
        scopes:
          description: The scopes the request has. An API key and the unix socket have all.
          items:
            type: string
          type: array
        tags:
          description: "The tags the caller may give, with those they own in the policy. null: tags do not limit the caller."
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - scopes
        - tags
        - resources
      type: object
    ClientReference:
      additionalProperties: false
      properties:
        description:
          type: string
        id:
          type: string
      required:
        - id
        - description
      type:
        - object
        - "null"
    CreateApiKeyBody:
      additionalProperties: false
      properties:
        expiry:
          description: When the key stops working, in the future. Required; there is no upper limit.
          format: date-time
          type: string
        userId:
          description: The user recorded on the key as its owner. It does not limit what the key may do.
          maxLength: 20
          type: string
      type: object
    CreateAuthKeyBody:
      additionalProperties: false
      properties:
        description:
          description: Free text for people, such as what the key is for.
          maxLength: 50
          type: string
        ephemeral:
          description: A node that joins with the key is removed some time after it disconnects.
          type: boolean
        expiry:
          description: When the key stops working, in the future. Required; there is no upper limit.
          format: date-time
          type: string
        reusable:
          description: More than one node may join with the key.
          type: boolean
        tags:
          description: The tags of the nodes that join with the key, each in tagOwners of the policy. Exactly one of userId and tags.
          items:
            type: string
          maxItems: 256
          type: array
        userId:
          description: The user who owns the nodes that join with the key. Exactly one of userId and tags.
          maxLength: 20
          type: string
      type: object
    CreateDebugNodeBody:
      additionalProperties: false
      properties:
        authId:
          description: The auth ID of the request, as the machine shows it; it starts with hskey-authreq-.
          maxLength: 64
          type: string
        hostname:
          description: The hostname the made-up node reports.
          maxLength: 255
          minLength: 1
          type: string
        routes:
          description: IP prefixes the node advertises once it is registered.
          items:
            type: string
          maxItems: 1024
          type: array
      required:
        - authId
        - hostname
        - routes
      type: object
    CreateOAuthClientBody:
      additionalProperties: false
      properties:
        description:
          description: Free text for people, such as what the client is for.
          maxLength: 50
          type: string
        scopes:
          description: The scopes the client may give its tokens; at least one. devices:core and auth_keys need tags.
          items:
            type: string
          maxItems: 64
          minItems: 1
          type: array
        tags:
          description: The tags the client may give its tokens, each in tagOwners of the policy.
          items:
            type: string
          maxItems: 256
          type: array
      required:
        - scopes
      type: object
    CreateUserBody:
      additionalProperties: false
      properties:
        displayName:
          maxLength: 128
          type: string
        email:
          maxLength: 254
          type: string
        name:
          description: The username.
          maxLength: 254
          type: string
        profilePicUrl:
          description: An absolute http or https URL.
          maxLength: 2048
          type: string
      required:
        - name
      type: object
    CreatedApiKey:
      additionalProperties: false
      properties:
        created:
          description: null for a key that does not record it.
          format: date-time
          type:
            - string
            - "null"
        expiry:
          description: When the key stops working; null for a key that never expires.
          format: date-time
          type:
            - string
            - "null"
        id:
          type: string
        key:
          description: The secret. It is in this answer and no other; the server keeps only a hash of it.
          type: string
        lastSeen:
          description: "When the key was last used, to the minute: a use within a minute of the last is not written. null for a key never used since it was recorded."
          format: date-time
          type:
            - string
            - "null"
        owner:
          $ref: "#/components/schemas/Owner"
          description: The user recorded on the key; tags is always []. null for a key with no owner. The owner does not limit what the key may do.
        prefix:
          description: The part of the key that is not secret.
          type: string
        removal:
          description: "When the server removes the revoked record; null while it is kept: not revoked, or kept for ever."
          format: date-time
          type:
            - string
            - "null"
        revoked:
          description: When the key was revoked, or null.
          format: date-time
          type:
            - string
            - "null"
        state:
          $ref: "#/components/schemas/ApiKeyState"
      required:
        - key
        - id
        - prefix
        - owner
        - state
        - expiry
        - created
        - lastSeen
        - revoked
        - removal
      type: object
    CreatedAuthKey:
      additionalProperties: false
      properties:
        created:
          description: null for a key that does not record it.
          format: date-time
          type:
            - string
            - "null"
        createdBy:
          $ref: "#/components/schemas/UserReference"
          description: The user who owns the credential that made the key; null for a key older than this field, made over the socket, or whose user is deleted. Not the owner.
        description:
          description: Free text for people, such as what the key is for; "" for none.
          type: string
        ephemeral:
          description: A node that joins with the key is removed some time after it disconnects.
          type: boolean
        expiry:
          description: When the key stops working; null for a key that never expires.
          format: date-time
          type:
            - string
            - "null"
        id:
          type: string
        key:
          description: The secret. It is in this answer and no other; the server keeps only a hash of it.
          type: string
        owner:
          $ref: "#/components/schemas/Owner"
          description: The user, or the tags, that a node joining with the key gets; for a tagged key user is null.
        prefix:
          description: The part of the key that is not secret.
          type: string
        removal:
          description: "When the server removes the revoked record; null while it is kept: not revoked, kept for ever, or a node still refers to the key."
          format: date-time
          type:
            - string
            - "null"
        reusable:
          type: boolean
        revoked:
          description: When the key was revoked, or null.
          format: date-time
          type:
            - string
            - "null"
        state:
          $ref: "#/components/schemas/AuthKeyState"
        used:
          description: A node has joined with the key.
          type: boolean
      required:
        - key
        - id
        - prefix
        - description
        - owner
        - createdBy
        - state
        - used
        - reusable
        - ephemeral
        - expiry
        - created
        - revoked
        - removal
      type: object
    CreatedOAuthClient:
      additionalProperties: false
      properties:
        created:
          description: null for a client that does not record it.
          format: date-time
          type:
            - string
            - "null"
        createdBy:
          $ref: "#/components/schemas/UserReference"
          description: The user who owns the credential that made the client; null when it was a token or the socket, or the user is deleted.
        description:
          description: Free text for people, such as what the client is for; "" for none.
          type: string
        id:
          description: The client ID; it is also the middle of the secret.
          type: string
        key:
          description: The client secret. It is in this answer and no other; the server keeps only a hash of it. Trade it for a token at POST /api/v2/oauth/token.
          type: string
        removal:
          description: "When the server removes the revoked record; null while it is kept: not revoked, or kept for ever."
          format: date-time
          type:
            - string
            - "null"
        revoked:
          description: When the client was revoked, or null.
          format: date-time
          type:
            - string
            - "null"
        scopes:
          description: The scopes the client may give its tokens.
          items:
            type: string
          type: array
        state:
          $ref: "#/components/schemas/OAuthClientState"
        tags:
          description: The tags the client may give its tokens, and they to keys and nodes; not an owner.
          items:
            type: string
          type: array
      required:
        - key
        - id
        - description
        - scopes
        - tags
        - createdBy
        - created
        - state
        - revoked
        - removal
      type: object
    Credential:
      additionalProperties: false
      properties:
        client:
          $ref: "#/components/schemas/ClientReference"
          description: For a token, the OAuth client it was issued to.
        expiry:
          format: date-time
          type:
            - string
            - "null"
        id:
          description: The ID of the stored credential; for an API key, the ID in /api-keys/{id}.
          type: string
        kind:
          enum:
            - apiKey
            - oauthToken
          type: string
        owner:
          $ref: "#/components/schemas/Owner"
          description: For an API key, the user recorded on it. It does not say who makes the request.
        prefix:
          description: The part of the secret that is not secret.
          type: string
      required:
        - kind
        - id
        - prefix
        - expiry
        - owner
        - client
      type:
        - object
        - "null"
    DeletedUser:
      additionalProperties: false
      properties:
        apiKeyCount:
          description: The API keys the user owns, revoked and expired ones too.
          format: int64
          type: integer
        authKeyCount:
          description: The auth keys the user owns, revoked and expired ones too; tagged keys it made stay.
          format: int64
          type: integer
        expect:
          description: Stands for the user and every node and key it owns. Send it as expect to remove only what this showed.
          type: string
        nodes:
          description: The nodes of the user, in ID order.
          items:
            $ref: "#/components/schemas/NodeReference"
          type: array
      required:
        - nodes
        - authKeyCount
        - apiKeyCount
        - expect
      type: object
    FailedTest:
      additionalProperties: false
      properties:
        column:
          description: The column of line, from 1, in bytes; null with line.
          format: int64
          type:
            - integer
            - "null"
        dst:
          description: The destination that failed, as written.
          type: string
        got:
          description: What the policy does.
          enum:
            - accept
            - deny
            - check
          type: string
        index:
          description: The position of the test in its list, from 0.
          format: int64
          type: integer
        kind:
          description: acl for an entry of tests, ssh for one of sshTests.
          enum:
            - acl
            - ssh
          type: string
        line:
          description: Where the policy text has the test, from 1; null when it cannot be found.
          format: int64
          type:
            - integer
            - "null"
        src:
          description: The source of the test, as written.
          type: string
        user:
          description: The login user of an ssh test; null for acl.
          type:
            - string
            - "null"
        want:
          description: What the test asserts.
          enum:
            - accept
            - deny
            - check
          type: string
      required:
        - kind
        - index
        - src
        - dst
        - user
        - want
        - got
        - line
        - column
      type: object
    FieldError:
      additionalProperties: false
      properties:
        location:
          description: Where the field is, such as body.tags[2] or query.pageSize.
          type: string
        message:
          type: string
      required:
        - location
        - message
      type: object
    GoInfo:
      additionalProperties: false
      properties:
        arch:
          type: string
        os:
          type: string
        version:
          type: string
      required:
        - version
        - os
        - arch
      type: object
    Health:
      additionalProperties: false
      properties:
        databaseConnectivity:
          type: boolean
        healthy:
          type: boolean
        warnings:
          description: What an admin should know; a warning never makes the server unhealthy. New codes may appear.
          items:
            $ref: "#/components/schemas/Message"
          type: array
      required:
        - healthy
        - databaseConnectivity
        - warnings
      type: object
    Identity:
      additionalProperties: false
      properties:
        issuer:
          type: string
        subject:
          type: string
      required:
        - issuer
        - subject
      type:
        - object
        - "null"
    Me:
      additionalProperties: false
      properties:
        authorization:
          $ref: "#/components/schemas/Authorization"
        credential:
          $ref: "#/components/schemas/Credential"
        principal:
          $ref: "#/components/schemas/Principal"
      required:
        - principal
        - credential
        - authorization
      type: object
    Message:
      additionalProperties: false
      properties:
        code:
          enum:
            - auth_requests_full
            - credential_check_busy
            - database_unreachable
            - node_expiry_invalid
            - node_name_invalid
            - policy_not_stored
            - policy_file_invalid
            - policy_stored_invalid
            - policy_user_ambiguous
          type: string
        details:
          additionalProperties: {}
          description: Data for this code; {} when it has none.
          type: object
        message:
          type: string
      required:
        - code
        - message
        - details
      type: object
    Node:
      additionalProperties: false
      properties:
        addresses:
          description: IPv4 first.
          items:
            type: string
          type: array
        advertisedRoutes:
          description: Routes the node offers.
          items:
            type: string
          type: array
        attributes:
          additionalProperties:
            type: string
          description: Node attributes, by name.
          type: object
        authKeyId:
          description: The ID of the auth key the node joined with.
          type:
            - string
            - "null"
        clientVersion:
          description: The short version of the Tailscale client; "" when unknown.
          type: string
        connectedToControl:
          description: The node holds a session with the server, expired or not. A node that is not expired stays connected for 15 seconds after its session ends; an expired node is released at once.
          type: boolean
        created:
          format: date-time
          type: string
        createdBy:
          $ref: "#/components/schemas/UserReference"
          description: The user who registered the node; null when the server does not know. Not the owner of a tagged node.
        discoKey:
          type: string
        enabledRoutes:
          description: Routes an admin or the policy approved.
          items:
            type: string
          type: array
        expired:
          description: The expiry has passed, by the server's clock.
          type: boolean
        expiry:
          description: "null: the node never expires, or its stored expiry is out of range (problems names it)."
          format: date-time
          type:
            - string
            - "null"
        fqdn:
          description: name and the base domain, without a trailing dot; "" when no base domain is set.
          type: string
        hostname:
          description: What the node reports. Read-only.
          type: string
        id:
          type: string
        isEphemeral:
          description: The node is removed some time after it disconnects.
          type: boolean
        lastSeen:
          description: Now while the node is connected; null if it never connected.
          format: date-time
          type:
            - string
            - "null"
        machineKey:
          type: string
        name:
          description: The name in Headscale, which can be changed.
          type: string
        nodeKey:
          type: string
        os:
          description: As the node reports it; "" when unknown.
          type: string
        owner:
          $ref: "#/components/schemas/Owner"
          description: One user, or tags.
        problems:
          description: The codes of the health checks the node fails, as in the warnings of GET /health; [] for a good node.
          items:
            type: string
          type: array
        registerMethod:
          description: How the node registered; "" for a node that does not record it, as os and clientVersion are "" when unknown. A client must accept a value it does not know.
          enum:
            - authKey
            - cli
            - oidc
            - ""
          type: string
        revision:
          description: Changes when the owner, the tags, the enabled routes, the name or the expiry change. Send it back in If-Match.
          type: string
        servingRoutes:
          description: "Routes the node serves to others now: approved, offered, and with this node chosen to serve them; exit routes too."
          items:
            type: string
          type: array
        updateAvailable:
          description: A newer stable Tailscale client exists; false also when the server does not know.
          type: boolean
      required:
        - id
        - name
        - hostname
        - fqdn
        - owner
        - addresses
        - connectedToControl
        - lastSeen
        - expiry
        - expired
        - created
        - clientVersion
        - updateAvailable
        - os
        - enabledRoutes
        - advertisedRoutes
        - servingRoutes
        - isEphemeral
        - registerMethod
        - authKeyId
        - createdBy
        - machineKey
        - nodeKey
        - discoKey
        - attributes
        - revision
        - problems
      type: object
    NodeList:
      additionalProperties: false
      properties:
        nextPageToken:
          description: Present when more rows can follow; send it back as pageToken. Missing on the last page.
          type: string
        nodes:
          items:
            $ref: "#/components/schemas/Node"
          type: array
      required:
        - nodes
      type: object
    NodeReference:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
      type: object
    OAuthClient:
      additionalProperties: false
      properties:
        created:
          description: null for a client that does not record it.
          format: date-time
          type:
            - string
            - "null"
        createdBy:
          $ref: "#/components/schemas/UserReference"
          description: The user who owns the credential that made the client; null when it was a token or the socket, or the user is deleted.
        description:
          description: Free text for people, such as what the client is for; "" for none.
          type: string
        id:
          description: The client ID; it is also the middle of the secret.
          type: string
        removal:
          description: "When the server removes the revoked record; null while it is kept: not revoked, or kept for ever."
          format: date-time
          type:
            - string
            - "null"
        revoked:
          description: When the client was revoked, or null.
          format: date-time
          type:
            - string
            - "null"
        scopes:
          description: The scopes the client may give its tokens.
          items:
            type: string
          type: array
        state:
          $ref: "#/components/schemas/OAuthClientState"
        tags:
          description: The tags the client may give its tokens, and they to keys and nodes; not an owner.
          items:
            type: string
          type: array
      required:
        - id
        - description
        - scopes
        - tags
        - createdBy
        - created
        - state
        - revoked
        - removal
      type: object
    OAuthClientList:
      additionalProperties: false
      properties:
        nextPageToken:
          description: Present when more rows can follow; send it back as pageToken. Missing on the last page.
          type: string
        oauthClients:
          items:
            $ref: "#/components/schemas/OAuthClient"
          type: array
      required:
        - oauthClients
      type: object
    OAuthClientState:
      description: A client must accept a value it does not know.
      enum:
        - valid
        - revoked
      type: string
    Owner:
      additionalProperties: false
      properties:
        tags:
          items:
            type: string
          type: array
        user:
          $ref: "#/components/schemas/OwnerUser"
      required:
        - user
        - tags
      type:
        - object
        - "null"
    OwnerUser:
      additionalProperties: false
      properties:
        displayName:
          type: string
        email:
          type: string
        id:
          type: string
        loginName:
          type: string
        name:
          type: string
      required:
        - id
        - name
        - loginName
        - displayName
        - email
      type:
        - object
        - "null"
    Policy:
      additionalProperties: false
      properties:
        mode:
          description: database, or file when the server reads the policy from a file. A file the server refused is not in force; GET /health warns of it.
          enum:
            - database
            - file
          type: string
        path:
          description: The policy file in file mode, else "".
          type: string
        policy:
          description: "The policy as it is stored or read from the file: HuJSON, with its comments. \"\" when there is none."
          type: string
        updated:
          description: When the database stored it; null in file mode and when nothing is stored.
          format: date-time
          type:
            - string
            - "null"
      required:
        - policy
        - updated
        - mode
        - path
      type: object
    PolicyError:
      additionalProperties: false
      properties:
        column:
          description: The column of line, from 1, in bytes; null with line.
          format: int64
          type:
            - integer
            - "null"
        line:
          description: Where the policy text has it, from 1; null when the problem has no place in the text.
          format: int64
          type:
            - integer
            - "null"
        message:
          description: The problem, a sentence for a person.
          type: string
      required:
        - message
        - line
        - column
      type: object
    PolicyInvalidDetails:
      additionalProperties: false
      properties:
        failedTestCount:
          description: How many assertions failed in all.
          format: int64
          type: integer
        failedTests:
          description: One entry per assertion that did not hold, at most 100.
          items:
            $ref: "#/components/schemas/FailedTest"
          type: array
        policyErrorCount:
          description: How many problems there are in all.
          format: int64
          type: integer
        policyErrors:
          description: One entry per problem, at most 100.
          items:
            $ref: "#/components/schemas/PolicyError"
          type: array
        testsNotRun:
          description: How many entries of tests and sshTests were not run because the policy was refused before them; 0 when they ran.
          format: int64
          type: integer
      required:
        - policyErrors
        - policyErrorCount
        - failedTests
        - failedTestCount
        - testsNotRun
      type: object
    Principal:
      additionalProperties: false
      properties:
        identity:
          $ref: "#/components/schemas/Identity"
          description: "The identity at an outside identity provider. Reserved: null today."
        kind:
          description: Who or what is authenticated. human and workload are reserved.
          enum:
            - apiKey
            - oauthClient
            - local
            - human
            - workload
          type: string
        user:
          $ref: "#/components/schemas/UserReference"
          description: "The Headscale user that has identity. Reserved: null today."
      required:
        - kind
        - identity
        - user
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: The stable code of the problem. Clients branch on this.
          enum:
            - auth_request_kind
            - email_taken
            - empty_patch
            - expiry_in_past
            - expiry_required
            - forbidden
            - internal
            - invalid_field
            - invalid_page_token
            - invalid_request
            - invalid_scope
            - method_not_allowed
            - name_taken
            - not_acceptable
            - not_found
            - owner_conflict
            - policy_invalid
            - policy_read_only
            - precondition_failed
            - registration_refused
            - request_timeout
            - scope_requires_tags
            - tags_not_permitted
            - tags_required
            - too_large
            - unauthorized
            - unhealthy
            - unsupported_media_type
            - update_refused
            - user_changed
            - user_has_nodes
            - user_managed_by_oidc
          type: string
        detail:
          description: A sentence for a person. It may change; programs must not read it.
          type: string
        details:
          additionalProperties: {}
          description: Data for this code, as its documentation describes.
          type: object
        errors:
          description: "For invalid_field: one entry per field."
          items:
            $ref: "#/components/schemas/FieldError"
          type: array
        object:
          $ref: "#/components/schemas/ProblemObject"
          description: The resource the problem is about, or null.
        requestId:
          description: The ID of this request in the server log.
          type: string
        status:
          description: The HTTP status.
          format: int64
          type: integer
        title:
          description: A short text, the same for every problem with this code.
          type: string
        type:
          description: A URL naming the problem, one per code; it leads to its documentation.
          type: string
      required:
        - type
        - title
        - status
        - code
        - detail
        - requestId
        - object
        - errors
        - details
      type: object
    ProblemObject:
      additionalProperties: false
      properties:
        id:
          description: The ID of the resource; always "" for an auth request, whose ID is a secret.
          type: string
        kind:
          enum:
            - node
            - user
            - authKey
            - apiKey
            - oauthClient
            - authRequest
          type: string
        name:
          type: string
      required:
        - kind
        - id
        - name
      type:
        - object
        - "null"
    RegisterAuthRequestBody:
      additionalProperties: false
      properties:
        userId:
          description: The user the new node belongs to.
          maxLength: 20
          type: string
      required:
        - userId
      type: object
    SSHCheckNodeReference:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
      type:
        - object
        - "null"
    SetNodeRoutesBody:
      additionalProperties: false
      properties:
        routes:
          description: IP prefixes; [] removes them all. One exit prefix approves both.
          items:
            type: string
          maxItems: 4096
          type: array
      required:
        - routes
      type: object
    SetNodeTagsBody:
      additionalProperties: false
      properties:
        tags:
          description: At least one tag, each in tagOwners of the policy.
          items:
            type: string
          maxItems: 256
          type: array
      required:
        - tags
      type: object
    SetPolicyBody:
      additionalProperties: false
      properties:
        policy:
          description: The policy, HuJSON. With Content-Type application/hujson the body is the policy file itself.
          type: string
      required:
        - policy
      type: object
    Tag:
      additionalProperties: false
      properties:
        inPolicy:
          description: The tag is in tagOwners of the policy; false for a tag nodes still have that the policy no longer names.
          type: boolean
        nodeCount:
          description: Every node that has the tag, also with the node filter.
          format: int64
          type: integer
        nodes:
          description: The same nodes, in ID order.
          items:
            $ref: "#/components/schemas/NodeReference"
          type: array
        tag:
          type: string
      required:
        - tag
        - inPolicy
        - nodeCount
        - nodes
      type: object
    TagList:
      additionalProperties: false
      properties:
        nextPageToken:
          description: Present when more rows can follow; send it back as pageToken. Missing on the last page.
          type: string
        tags:
          items:
            $ref: "#/components/schemas/Tag"
          type: array
      required:
        - tags
      type: object
    UpdateNodeBody:
      additionalProperties: false
      properties:
        expiry:
          description: An RFC 3339 time in the future, "now" for the server's clock, or null for never. A time turns key expiry on.
          maxLength: 64
          type:
            - string
            - "null"
        name:
          description: A DNS label; "" resets it to the name made from the hostname.
          maxLength: 63
          type: string
      type: object
    UpdateUserBody:
      additionalProperties: false
      properties:
        displayName:
          description: "\"\" clears it."
          maxLength: 128
          type: string
        email:
          description: "\"\" clears it."
          maxLength: 254
          type: string
        name:
          description: The username; it cannot be empty.
          maxLength: 254
          type: string
        profilePicUrl:
          description: An absolute http or https URL; "" clears it.
          maxLength: 2048
          type: string
      type: object
    User:
      additionalProperties: false
      properties:
        created:
          format: date-time
          type: string
        displayName:
          type: string
        email:
          type: string
        id:
          type: string
        loginName:
          description: "What Headscale shows for the user: the email, else the name, else the provider ID. Read-only."
          type: string
        name:
          description: The stored username; it can be empty for a user from OIDC.
          type: string
        nodeCount:
          description: Nodes the user owns; tagged nodes are owned by their tags and not counted.
          format: int64
          type: integer
        nodes:
          description: The same nodes, in ID order.
          items:
            $ref: "#/components/schemas/NodeReference"
          type: array
        profilePicUrl:
          type: string
        provider:
          description: Where the user comes from. A client must accept a value it does not know.
          enum:
            - local
            - oidc
          type: string
        providerId:
          description: The identifier at the identity provider; empty for a local user.
          type: string
      required:
        - id
        - name
        - loginName
        - displayName
        - email
        - profilePicUrl
        - provider
        - providerId
        - nodeCount
        - nodes
        - created
      type: object
    UserList:
      additionalProperties: false
      properties:
        nextPageToken:
          description: Present when more rows can follow; send it back as pageToken. Missing on the last page.
          type: string
        users:
          items:
            $ref: "#/components/schemas/User"
          type: array
      required:
        - users
      type: object
    UserReference:
      additionalProperties: false
      properties:
        id:
          type: string
        loginName:
          type: string
      required:
        - id
        - loginName
      type:
        - object
        - "null"
    VersionInfo:
      additionalProperties: false
      properties:
        buildTime:
          type: string
        commit:
          type: string
        dirty:
          type: boolean
        go:
          $ref: "#/components/schemas/GoInfo"
        version:
          type: string
      required:
        - version
        - commit
        - buildTime
        - go
        - dirty
      type: object
  securitySchemes:
    bearer:
      scheme: bearer
      type: http
info:
  description: Headscale's own API. It may change in any minor release; every change is in the changelog under "API v0".
  title: Headscale API
  version: v0
openapi: 3.1.0
paths:
  /api/headscale/v0/api-keys:
    get:
      description: In ID order, expired and revoked keys too, until the server removes them. No answer holds a secret.
      operationId: listApiKeys
      parameters:
        - description: Rows on one page.
          explode: false
          in: query
          name: pageSize
          schema:
            default: 25
            description: Rows on one page.
            format: int64
            maximum: 1000
            minimum: 1
            type: integer
        - description: nextPageToken of the page before, unchanged, with the same filters. Leave it out for the first page.
          explode: false
          in: query
          name: pageToken
          schema:
            description: nextPageToken of the page before, unchanged, with the same filters. Leave it out for the first page.
            type: string
        - description: Only the keys owned by the user with this ID; an ID no user has matches no key.
          explode: false
          in: query
          name: user
          schema:
            description: Only the keys owned by the user with this ID; an ID no user has matches no key.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
          description: OK
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unauthorized: unauthorized"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Forbidden: forbidden"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unprocessable Entity: invalid_field, invalid_page_token"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Internal Server Error: internal"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Service Unavailable: unhealthy"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
      security:
        - bearer:
            - all:read
      summary: List API keys
      tags:
        - API keys
      x-problem-codes:
        - forbidden
        - internal
        - invalid_field
        - invalid_page_token
        - unauthorized
        - unhealthy
    post:
      description: An API key may do everything, so only an API key or the unix socket can make one; an OAuth access token cannot, whatever its scopes. The answer holds the secret, in key; no other answer does.
      operationId: createApiKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiKey"
          description: Created
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
            Location:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Bad Request: invalid_request"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unauthorized: unauthorized"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Forbidden: forbidden"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "408":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Request Timeout: request_timeout"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Request Entity Too Large: too_large"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "415":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unsupported Media Type: unsupported_media_type"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unprocessable Entity: expiry_in_past, expiry_required, invalid_field"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Internal Server Error: internal"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Service Unavailable: unhealthy"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
      security:
        - bearer:
            - all
      summary: Create an API key
      tags:
        - API keys
      x-problem-codes:
        - expiry_in_past
        - expiry_required
        - forbidden
        - internal
        - invalid_field
        - invalid_request
        - request_timeout
        - too_large
        - unauthorized
        - unhealthy
        - unsupported_media_type
      x-token-rules:
        - token_cannot_create_api_key
  /api/headscale/v0/api-keys/{id}:
    delete:
      description: The key is refused from its next request on; a key can revoke itself. Its record stays, revoked, until the server removes it (removal). Repeating the call answers 204 again and changes nothing.
      operationId: deleteApiKey
      parameters:
        - description: The ID of the API key.
          in: path
          name: id
          required: true
          schema:
            description: The ID of the API key.
            type: string
      responses:
        "204":
          description: No Content
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unauthorized: unauthorized"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Forbidden: forbidden"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Not Found: not_found"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Unprocessable Entity: invalid_field"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Internal Server Error: internal"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "Service Unavailable: unhealthy"
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
      security:
        - bearer:
            - all
      summary: Revoke an API key
      tags:
        - API keys
      x-problem-codes:
        - forbidden
        - internal
        - invalid_field
        - not_found
        - unauthorized
        - unhealthy
    get:
      description: Without the secret. A revoked key is read until the server removes it.
      operationId: getApiKey
      parameters:
        - description: The ID of the API key.
          in: path
          name: id
          required: true
          schema:
            description: The ID of the API key.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
          description: OK
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
