  /api/headscale/v0/users/{id}:
    delete:
      description: "Removes the user with the auth keys and API keys it owns, and with withNodes=true its nodes, in one step that cannot be undone: all of it or none of it. Tagged nodes and keys the user made stay. The answer is what was removed; with dryRun=true it is what would be, and nothing is removed. Send the expect of a dry run to remove only what it showed. withNodes=true needs the scope devices:core as well as users (x-parameter-scopes); a token without it is forbidden before the request is read. A step after the delete committed that fails, such as a refresh of the policy, is logged, and the answer is still what was removed."
      operationId: deleteUser
      parameters:
        - description: The ID of the user.
          in: path
          name: id
          required: true
          schema:
            description: The ID of the user.
            type: string
        - description: Delete the nodes the user owns too. Needs the scope devices:core as well as users.
          explode: false
          in: query
          name: withNodes
          schema:
            description: Delete the nodes the user owns too. Needs the scope devices:core as well as users.
            type: boolean
        - description: Answer what the delete would remove, and remove nothing.
          explode: false
          in: query
          name: dryRun
          schema:
            description: Answer what the delete would remove, and remove nothing.
            type: boolean
        - description: "The expect of a dry run: refuse with user_changed and remove nothing when a node or a key of the user came or went since."
          explode: false
          in: query
          name: expect
          schema:
            description: "The expect of a dry run: refuse with user_changed and remove nothing when a node or a key of the user came or went since."
            pattern: ^[0-9a-f]{16}$
            type: string
