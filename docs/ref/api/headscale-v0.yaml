              schema:
                $ref: "#/components/schemas/CreatedAPIKey"
          description: Created
          headers:
            Headscale-Commit:
              description: The short commit of the server, when the build knows it.
              schema:
                type: string
            Headscale-Version:
              description: The version of the server.
              required: true
              schema:
                type: string
            Location:
              required: true
              schema:
                type: string
        "400":
          content:
