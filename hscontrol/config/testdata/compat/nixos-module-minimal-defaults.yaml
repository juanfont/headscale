%YAML 1.1
---
auto_update:
  enabled: false
database:
  debug: false
  gorm:
    parameterized_queries: false
    skip_err_record_not_found: false
    slow_threshold: 0
  postgres:
    conn_max_idle_time_secs: 3600
    host: ''
    max_idle_conns: 10
    max_open_conns: 10
    name: ''
    pass: ''
    port: 0
    ssl: 'false'
    user: ''
  sqlite:
    path: /var/lib/headscale/db.sqlite
    wal_autocheckpoint: 1000
    write_ahead_log: true
  type: sqlite
derp:
  auto_update_enabled: true
  paths: []
  server:
    automatically_add_embedded_derp_region: true
    enabled: false
    ipv4: ''
    ipv6: ''
    private_key_path: /var/lib/headscale/derp_server_private.key
    region_code: ''
    region_id: 0
    region_name: ''
    stun_listen_addr: ''
    verify_clients: true
  update_frequency: 3h
  urls:
  - https://controlplane.tailscale.com/derpmap/default
disable_check_updates: true
dns:
  base_domain: tailnet.example.com
  certificates:
    enabled: false
    zone: ''
  challenge:
    propagation_timeout: 2m
    provider: {}
    resolvers:
    - 1.1.1.1:53
    - 8.8.8.8:53
  extra_records: []
  extra_records_path: ''
  magic_dns: true
  nameservers:
    global:
    - 1.1.1.1
    - 8.8.8.8
    split: {}
  override_local_dns: true
  search_domains: []
listen_addr: 0.0.0.0:8080
log:
  format: text
  level: info
logtail:
  enabled: false
metrics_listen_addr: ''
node:
  ephemeral:
    inactivity_timeout: 30m
  expiry: 0s
  routes:
    ha:
      probe_interval: 10s
      probe_timeout: 5s
noise:
  private_key_path: /var/lib/headscale/noise_private.key
oidc:
  allowed_domains: []
  allowed_groups: []
  allowed_users: []
  client_id: ''
  client_secret: ''
  email_verified_required: true
  extra_params: {}
  issuer: ''
  only_start_if_oidc_is_available: true
  pkce:
    enabled: false
    method: S256
  scope:
  - openid
  - profile
  - email
  use_expiry_from_token: false
policy:
  mode: file
  path: ''
preauth_keys:
  revoked_retention: 168h
prefixes:
  allocation: sequential
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
server_url: https://headscale.example.com
taildrop:
  enabled: true
tls:
  acme:
    cache_dir: /var/lib/headscale/cache
    challenge_type: HTTP-01
    email: ''
    hostname: ''
    http_listen: :http
    url: ''
  cert_path: ''
  key_path: ''
trusted_proxies: []
tuning:
  batch_change_delay: 800ms
  batcher_workers: 0
  node_mapsession_buffered_chan_size: 30
  node_store_batch_size: 100
  node_store_batch_timeout: 500ms
  register_cache_expiration: 15m
  register_cache_max_entries: 1024
unix_socket: /run/headscale/headscale.sock
unix_socket_permission: '0770'
