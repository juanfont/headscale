noise:
  private_key_path: "private_key.pem"

prefixes:
  v6: fd7a:115c:a1e0::/48
  v4: 100.64.0.0/10

database:
  type: sqlite3

server_url: "https://server.derp.no"

dns:
  magic_dns: true
  base_domain: derp2.no
  override_local_dns: true
  nameservers:
    global:
      - 100.64.0.1
      - 100.64.0.2
    split:
      foo.bar.com:
        - 100.64.0.1
        - 100.64.0.2
      baz.example.com:
        - 100.64.0.1
    use_with_exit_node:
      global:
        - 100.64.0.2
      split:
        foo.bar.com:
          - 100.64.0.1
