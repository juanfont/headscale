services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    hostname: keycloak
    networks:
      e2e:
        ipv4_address: 172.30.0.5
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_HOSTNAME_STRICT=false
    ports:
      - "8180:8080"
    command: start-dev

  keycloak-init:
    image: alpine:3.20
    container_name: keycloak-init
    networks:
      e2e:
    depends_on:
      - keycloak
    entrypoint: ["sh", "-c"]
    command: ["apk add --no-cache curl jq bash && sleep 15 && sh /init.sh"]
    volumes:
      - ./keycloak-init.sh:/init.sh:ro

  headscale:
    build:
      context: ..
      dockerfile: e2e/Dockerfile.server
    container_name: headscale-server
    hostname: headscale-server
    networks:
      e2e:
        ipv4_address: 172.30.0.10
    volumes:
      - headscale-data:/var/lib/headscale
    depends_on:
      keycloak-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "test", "-f", "/var/lib/headscale/.api_key"]
      interval: 3s
      timeout: 3s
      retries: 20

  client-alice:
    build:
      context: ..
      dockerfile: e2e/Dockerfile.client
    container_name: client-alice
    hostname: client-alice
    networks:
      e2e:
        ipv4_address: 172.30.0.20
    depends_on:
      headscale:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    volumes:
      - ./tests:/tests
      - headscale-data:/var/lib/headscale:ro
      - client-alice-data:/var/lib/tailscale
    environment:
      - HEADSCALE_URL=http://headscale-server:8080
      - HEADSCALE_IP=172.30.0.10
      - TEST_USER=alice
      - TEST_USER_ID=1

  client-bob:
    build:
      context: ..
      dockerfile: e2e/Dockerfile.client
    container_name: client-bob
    hostname: client-bob
    networks:
      e2e:
        ipv4_address: 172.30.0.30
    depends_on:
      headscale:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
    volumes:
      - ./tests:/tests
      - headscale-data:/var/lib/headscale:ro
      - client-bob-data:/var/lib/tailscale
    environment:
      - HEADSCALE_URL=http://headscale-server:8080
      - HEADSCALE_IP=172.30.0.10
      - TEST_USER=bob
      - TEST_USER_ID=2

networks:
  e2e:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  headscale-data:
  client-alice-data:
  client-bob-data:
